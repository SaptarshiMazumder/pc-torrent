name: Desktop Release

# Push a tag like ``desktop-v1.0.3`` to ship a new desktop build.
# The job verifies that the tag's version matches the version baked
# into desktop/src-tauri/tauri.conf.json, then builds the NSIS installer
# and attaches it to a GitHub Release for that tag.  The asset is
# renamed to a stable filename so the "latest" download URL never
# changes:
#
#   https://github.com/SaptarshiMazumder/pc-torrent/releases/latest/download/pc-rent-windows-x64.exe
#
# The serverV2 /app/min-version endpoint hands that URL plus a
# Firestore-tunable min_version back to running desktops, which gate
# the UI behind UpdateRequiredModal when their version falls below.

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Verify tag version matches tauri.conf.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("desktop-v")) {
            throw "Tag '$tag' does not match the expected 'desktop-v*' pattern"
          }
          $tagVersion = $tag.Substring("desktop-v".Length)
          $confVersion = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tagVersion -ne $confVersion) {
            throw "Tag version '$tagVersion' does not match tauri.conf.json version '$confVersion'. Bump tauri.conf.json before tagging."
          }
          Write-Host "Version OK: $tagVersion"
          echo "VERSION=$tagVersion" >> $env:GITHUB_ENV

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Build agent sidecar (PyInstaller)
        # Produces desktop/src-tauri/pcrent-agent-x86_64-pc-windows-msvc.exe,
        # which Tauri picks up via the ``externalBin`` config and bundles
        # into the installer.  The binary is gitignored, so it has to be
        # built here on every run.
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements.txt
          python agent/build_sidecar.py

      - name: Build Tauri installer
        working-directory: desktop
        run: npm run tauri build

      - name: Rename installer to stable filename
        shell: pwsh
        run: |
          $bundleDir = "desktop/src-tauri/target/release/bundle/nsis"
          $produced = Get-ChildItem -Path "$bundleDir/*.exe" | Select-Object -First 1
          if (-not $produced) {
            throw "No NSIS installer found under $bundleDir"
          }
          $stable = "$bundleDir/pc-rent-windows-x64.exe"
          Copy-Item -Path $produced.FullName -Destination $stable -Force
          Write-Host "Staged installer: $stable (from $($produced.Name))"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Forge v${{ env.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: desktop/src-tauri/target/release/bundle/nsis/pc-rent-windows-x64.exe
